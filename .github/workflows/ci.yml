name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  quality-gate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: "package.json"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Run repository quality gate
        run: npm run check

  frontend-e2e:
    runs-on: ubuntu-latest
    needs: quality-gate

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: "package.json"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Install Playwright browser
        run: npm run test:e2e:install

      - name: Run frontend E2E smoke suite
        run: npm run test:e2e

  local-web-smoke:
    runs-on: ubuntu-latest
    needs: quality-gate

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: "package.json"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Build frontend assets
        run: npm run build

      - name: Smoke test backend with static frontend hosting
        shell: bash
        run: |
          node backend/server.js > server.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:3102/api/health > /dev/null; then
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3102/api/health > /dev/null
          curl -fsS http://127.0.0.1:3102/ > /dev/null
        env:
          APP_HOST: 127.0.0.1
          APP_PORT: 3102
          APP_ALLOWED_ORIGINS: http://127.0.0.1:4173
          APP_FRONTEND_DIST: dist
          APP_CONFIG_DIR: .ci/runtime-local-web
