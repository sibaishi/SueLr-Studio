services:
  suelr-studio:
    image: ${SUE_LR_IMAGE:?Set SUE_LR_IMAGE to the prebuilt server-web image}
    container_name: suelr-studio
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
      - "127.0.0.1:3002:3002"
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 3001
      ADMIN_HOST: 0.0.0.0
      ADMIN_PORT: 3002
      APP_RUNTIME_MODE: server-single-user
      APP_ALLOWED_ORIGINS: https://studio.suelr.com,https://admin.studio.suelr.com
      APP_ADMIN_ACCESS_KEY: change-this-admin-key
      APP_FRONTEND_DIST: /app/dist
      ADMIN_FRONTEND_DIST: /app/dist
      APP_CONFIG_DIR: /data
    volumes:
      - ./data:/data
